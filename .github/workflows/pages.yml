# Publishes the app to GitHub Pages (https://fruutium.github.io/smokecheck/).
# Pages only serves files, so each run makes tonight's forecast and saves every answer as a file (build_site.py).
name: Publish the site

on:
  push:
    branches: [main]
  schedule:
    # Every 30 minutes from 2:00 to 11:30 PM Central standard time (20:00-05:30 UTC), while today's readings come in.
    # Nothing runs overnight or in the morning, so last evening's call stays up for the practice day itself.
    - cron: "*/30 20-23 * * *"
    - cron: "*/30 0-5 * * *"
  workflow_dispatch:  # a "Run workflow" button on GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install -r app/requirements.txt

      # EPA's yearly site lists (about 40 MB) only tell the forecast which monitors belong to each city.
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: epa-site-lists-v1
      # The last forecast, so a failed run keeps showing it instead of nothing.
      - uses: actions/cache@v4
        with:
          path: data/tomorrow.csv
          key: tomorrow-${{ github.run_id }}
          restore-keys: tomorrow-

      - id: forecast
        run: python forecast_tomorrow.py
        continue-on-error: true
      - run: python build_site.py ${{ steps.forecast.outcome == 'failure' && '--forecast-failed' || '' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
